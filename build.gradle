plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Myriad's releases. To build against unreleased Myriad changes, run `./gradlew publishToMavenLocal` there and add
	// mavenLocal() here.
	maven {
		name = "Myriad"
		url = "https://fyzz-dev.github.io/myriad"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "dev.myriad:myriad:${project.myriad_version}"
	// Only for `./gradlew runClient`, so the menu has something in it while you test.
	localRuntime "dev.myriad:myriad-essentials:${project.essentials_version}"
}

loom {
	runs {
		client {
			// Opens the Myriad menu over the title screen on launch (handy while working on panels and HUD elements).
			property("myriad.openDesktop", "true")
		}
	}
}

processResources {
	def props = [version: project.version, myriad_version: project.myriad_version, minecraft_version: project.minecraft_version]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// `./gradlew publishToMavenLocal` makes it available to other projects (the Myriad repo's dev client uses it if present).
apply plugin: 'maven-publish'
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
