plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Myriad isn't on a public maven yet: run `./gradlew publishToMavenLocal` in the Myriad repo once (and again
	// after updating it) and Gradle picks it up from ~/.m2.
	mavenLocal()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "dev.myriad:myriad:${project.myriad_version}"
	// Only for `./gradlew runClient`, so the menu has something in it while you test.
	modLocalRuntime "dev.myriad:myriad-essentials:${project.myriad_version}"
}

loom {
	runs {
		client {
			// Opens the Myriad menu over the title screen on launch (handy while working on panels and HUD elements).
			property("myriad.openDesktop", "true")
		}
	}
}

processResources {
	def props = [version: project.version, myriad_version: project.myriad_version, minecraft_version: project.minecraft_version]
	inputs.properties props
	filesMatching("fabric.mod.json") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// `./gradlew publishToMavenLocal` makes it available to other projects (the Myriad repo's dev client uses it if present).
apply plugin: 'maven-publish'
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
